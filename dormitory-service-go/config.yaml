server:
    port: 8083

database:
    dsn: "root:root_dev@tcp(localhost:3306)/dormitory?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai&clientFoundRows=true"
    driver: mysql
    max_open_conns: 25
    max_idle_conns: 10

redis:
    host: "127.0.0.1"
    port: 6379
    db: 0
    password: ""

kafka:
    brokers:
        - "localhost:9092"
    event_topic: "t_dorm_event"
    alert_topic: "t_dorm_alert"
    group_id: "dormitory-service-group"
    max_poll_records: 500
    frame_topic: "t_dorm_frame"
    preview_group_id: "preview-group"
    dlq_topic: "t_dorm_event_dlq"
    dlq_group_id: "dormitory-service-dlq-group"

jwt:
    # ⚠ SECURITY: Change this secret in production! The default value is for dev only.
    secret: "${JWT_SECRET:your-256-bit-secret}" # Override via JWT_SECRET env var; set to match main backend's signing key in production
    expiration_hours: 24

face:
    # Authentication key for POST /api/face/match.
    # The face-recognition module sends this as a Bearer token in the
    # Authorization header (format: "Authorization: Bearer <match_key>").
    # Can also be overridden via FACE_MATCH_KEY env var.
    match_key: ""
    # Cosine similarity threshold (0.0-1.0). Face match passes when >= threshold.
    match_threshold: 0.65

log:
    level: "info"
