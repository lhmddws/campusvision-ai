[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campusvision-face-recognition"
version = "0.4.0"
description = "Face detection, recognition, and behavior analysis service for CampusVision AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["face-recognition", "surveillance", "computer-vision", "onnx"]
authors = [
    {name = "CampusVision AI"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
    "kafka-python>=2.0",
    "httpx>=0.26",
    "requests>=2.31",
    "PyYAML>=6.0",
    "redis>=5.0",
    "structlog>=24.0",
]

[project.urls]
Homepage = "https://github.com/lhmddws/campusvision-ai"
Repository = "https://github.com/lhmddws/campusvision-ai"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv/", "tests/", "__pycache__/"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N"]
