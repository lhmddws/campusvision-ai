name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - stream-gateway
          - dormitory-service-go
          - face-recognition
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.26
        if: ${{ matrix.service == 'stream-gateway' || matrix.service == 'dormitory-service-go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            stream-gateway/go.sum
            dormitory-service-go/go.sum

      - name: Setup Python 3.11
        if: ${{ matrix.service == 'face-recognition' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: face-recognition/requirements.txt

      - name: Setup Node.js 24
        if: ${{ matrix.service == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        if: ${{ matrix.service == 'frontend' }}
        run: corepack enable pnpm && corepack prepare pnpm@9 --activate && pnpm --version

      - name: Cache pnpm store
        if: ${{ matrix.service == 'frontend' }}
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Python dependencies
        if: ${{ matrix.service == 'face-recognition' }}
        run: |
          cd face-recognition
          pip install -r requirements.txt
          pip install ruff

      - name: Install pnpm dependencies
        if: ${{ matrix.service == 'frontend' }}
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run go vet (stream-gateway)
        if: ${{ matrix.service == 'stream-gateway' }}
        working-directory: stream-gateway
        run: |
          go vet ./...

      - name: Run go vet (dormitory-service-go)
        if: ${{ matrix.service == 'dormitory-service-go' }}
        working-directory: dormitory-service-go
        run: |
          go vet ./...

      - name: Run ruff check
        if: ${{ matrix.service == 'face-recognition' }}
        working-directory: face-recognition
        run: ruff check .

      - name: Run eslint
        if: ${{ matrix.service == 'frontend' }}
        working-directory: frontend
        run: npx eslint . --ext .vue,.js,.ts --max-warnings 330

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - stream-gateway
          - dormitory-service-go
          - face-recognition
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.26
        if: ${{ matrix.service == 'stream-gateway' || matrix.service == 'dormitory-service-go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            stream-gateway/go.sum
            dormitory-service-go/go.sum

      - name: Setup Python 3.11
        if: ${{ matrix.service == 'face-recognition' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: face-recognition/requirements.txt

      - name: Setup Node.js 24
        if: ${{ matrix.service == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        if: ${{ matrix.service == 'frontend' }}
        run: corepack enable pnpm && corepack prepare pnpm@9 --activate && pnpm --version

      - name: Cache pnpm store
        if: ${{ matrix.service == 'frontend' }}
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Python dependencies
        if: ${{ matrix.service == 'face-recognition' }}
        run: |
          cd face-recognition
          pip install -r requirements.txt
          pip install pytest

      - name: Install pnpm dependencies
        if: ${{ matrix.service == 'frontend' }}
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run stream-gateway tests
        if: ${{ matrix.service == 'stream-gateway' }}
        working-directory: stream-gateway
        run: go test ./... -v

      - name: Run dormitory-service-go tests
        if: ${{ matrix.service == 'dormitory-service-go' }}
        working-directory: dormitory-service-go
        run: go test ./... -v

      - name: Run face-recognition tests
        if: ${{ matrix.service == 'face-recognition' }}
        working-directory: face-recognition
        run: python -m pytest tests/ -v

      - name: Run frontend tests
        if: ${{ matrix.service == 'frontend' }}
        working-directory: frontend
        run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            stream-gateway/go.sum
            dormitory-service-go/go.sum

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: corepack enable pnpm && corepack prepare pnpm@9 --activate && pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install pnpm dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build stream-gateway binary
        working-directory: stream-gateway
        run: go build -o /dev/null ./cmd/main.go

      - name: Build dormitory-service-go binary
        working-directory: dormitory-service-go
        run: go build -o /dev/null ./cmd/dormitory-service/

      - name: Build frontend
        working-directory: frontend
        run: pnpm build:prod

      - name: Verify Docker Compose config
        run: docker compose config
